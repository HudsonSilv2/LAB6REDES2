services:
  mysql:
    image: mysql:8
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: lab6
    networks:
      - backend

  redis:
    image: redis:7
    networks:
      - backend

  api:
    build: ../api
    cap_add:
      - NET_ADMIN
    networks:
      app:
      management:
      backend:

  nginx:
    image: nginx:alpine
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    ports:
      - "127.0.0.1:8443:443"
    networks:
      - frontend
      - app

  admin:
    image: nicolaka/netshoot:latest
    command: sleep infinity
    networks:
      - frontend
      - management

networks:
  frontend:
    driver: bridge

  app:
    driver: bridge
    internal: true

  management:
    driver: bridge
    internal: true

  backend:
    driver: bridge
    internal: true
